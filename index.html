<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Clinic Master</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f6;--card:#fff;--tx:#17302b;--mu:#5d7a74;--ac:#0f766e;--bd:#d5e2df}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#172624;--tx:#e3f0ed;--mu:#8fb0a9;--ac:#2bb3a5;--bd:#2c4440}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#172624;--tx:#e3f0ed;--mu:#8fb0a9;--ac:#2bb3a5;--bd:#2c4440}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--ac);color:#fff}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{background:transparent;color:var(--tx);white-space:nowrap}nav button.on{background:var(--ac);color:#fff}
main{padding:12px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.g .card{margin:0}
.big{font-size:20px;font-weight:700;margin-top:4px}.mu{color:var(--mu);font-size:13px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button.s{padding:3px 8px;margin:1px;background:transparent;color:var(--ac);border:1px solid var(--ac);font-size:13px}
header button.s{color:#fff;border-color:#fff}
input,select,textarea{padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;max-width:100%}
label{display:block;margin:8px 0}label input,label select{width:100%}
.f{display:flex;flex-wrap:wrap;gap:8px}.f2 textarea{width:100%;min-height:64px;margin-bottom:8px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
#prt{display:none;position:fixed;inset:0;overflow:auto;background:#fff;color:#000;padding:12px;z-index:10}#dlg{display:none}.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #ccc}#prt table{width:100%;border-collapse:collapse}#prt td,#prt th{border:1px solid #999;padding:4px;text-align:left}
@media print{body>*{display:none!important}body>#prt{display:block!important;position:static;color:#000;background:#fff;padding:12px}.tb{display:none!important}}
</style></head><body><div id="app"></div><div id="prt"></div><div id="dlg"></div><div id="toast" style="position:fixed;top:8px;right:8px;z-index:30"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const dOpts=()=>S.drugs.map(d=>`<option value="${d.id}">${esc(d.name)} (${esc(d.unit)})</option>`).join('');
const moves=()=>[...S.sin.map(x=>({...x,k:'IN'})),...S.sout.map(x=>({...x,k:'OUT'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
const stkTbl=()=>`<table><tr><th>Drug</th><th>Unit</th><th>Tabs/strip</th><th>Cost/unit</th><th>Cost/tablet</th><th>In</th><th>Out</th><th>Balance</th><th>Stock value</th><th>Status</th></tr>${S.drugs.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.unit)}</td><td>${per(d)>1?per(d):'-'}</td><td>${money(cs(d))}</td><td>${per(d)>1?cpt1(d).toFixed(2):'-'}</td><td>${fmt(d,tin(d.id))}</td><td>${fmt(d,tout(d.id))}</td><td><b>${fmt(d,bal(d.id))}</b></td><td>${money(Math.round(bal(d.id)*cpt1(d)))}</td><td>${bal(d.id)<=d.re?'LOW - reorder':'OK'}</td></tr>`).join('')}</table>`;
const movTbl=()=>`<table><tr><th>Date</th><th>Type</th><th>Drug</th><th>Qty</th><th>Details</th><th>By</th></tr>${moves().map(x=>`<tr><td>${x.date}</td><td>${x.k}</td><td>${esc(dn(x.d))}</td><td>${x.q}</td><td>${x.k=='IN'?esc([x.sup,x.b?'batch '+x.b:'',x.ex?'exp '+x.ex:'',x.sq?x.sq+' '+((S.drugs.find(g=>g.id==x.d)||{}).unit||'units'):'',x.c?'unit cost '+money(x.c):''].filter(Boolean).join(', ')):esc(x.r+(x.n?' - '+x.n:''))}</td><td>${esc(x.by)}</td></tr>`).join('')}</table>`;
V.stock=()=>`<div class="card"><h3>Add drug to list</h3><div class="f"><input id="gn" placeholder="Drug name"><select id="gu" onchange="cprev()">${['strips','ampules','vials','bottles','boxes','packs','rolls'].map(u=>`<option value="${u}">${u[0].toUpperCase()+u.slice(1)}</option>`).join('')}</select><input id="gp" type="number" placeholder="Tablets/capsules per strip (strips only)" oninput="cprev()"><input id="gc" type="number" placeholder="Cost of one unit (UGX)" oninput="cprev()"><input id="gr" type="number" placeholder="Reorder level (tablets)"><button onclick="addDrug()">Add drug</button></div><p class="mu" id="gcp">Choose the unit. For strips, enter the tablets per strip and the cost of one strip to see the cost of one tablet or capsule.</p></div>
<div class="card"><h3>Stock in (receive drugs)</h3><div class="f"><select id="kid">${dOpts()}</select><input id="kiq" type="number" placeholder="Quantity received (in the drug's unit)"><input id="kic" type="number" placeholder="Cost of one unit (UGX)"><input id="kis" placeholder="Supplier"><input id="kib" placeholder="Batch no."><input id="kie" type="date" title="Expiry date"><button onclick="addIn()">Receive</button></div></div>
<div class="card"><h3>Stock out (issue drugs)</h3><div class="f"><select id="kod">${dOpts()}</select><input id="koq" type="number" placeholder="Quantity out (tablets for strips, else units)"><select id="kor">${REAS.map(r=>`<option>${r}</option>`).join('')}</select><input id="kon" placeholder="Patient / notes"><button onclick="addOut()">Issue</button></div></div>
<div class="card sc"><h3>Stock balance</h3><div class="f"><button onclick="prStock()">Print</button><button onclick="mlStock()">Email</button></div>${stkTbl()}</div>
<div class="card sc"><h3>Recent stock movements</h3>${movTbl()}</div>`;
const cs=d=>{const l=S.sin.filter(x=>x.d==d.id&&x.c).slice(-1)[0];return l?l.c:(d.sc||0)},per=d=>d.per||1,cpt1=d=>cs(d)/per(d);
function cprev(){const st=v('gu')=='strips',p=st?(+v('gp')||1):1,c=+v('gc');$('#gcp').textContent=c?(st?'Cost of one tablet/capsule: UGX '+(c/p).toFixed(2)+' ('+money(c)+' / '+p+')':'Cost of one '+v('gu').replace(/s$/,'')+': UGX '+money(c)):''}
const fmt=(d,n)=>{const p=per(d);return p>1?`${Math.floor(n/p)} ${d.unit} + ${n%p} tabs`:`${n} ${d.unit}`};
function addDrug(){if(!v('gn'))return alert('Drug name required');S.drugs.push({id:uid(),name:v('gn'),unit:v('gu'),per:v('gu')=='strips'?Math.max(1,+v('gp')||1):1,sc:+v('gc')||0,re:+v('gr')||0});R()}
function addIn(){const d=S.drugs.find(x=>x.id==v('kid')),sq=+v('kiq');if(!d||!(sq>0))return alert('Choose a drug and enter the quantity received.');const c=+v('kic')||d.sc||0,q=sq*per(d);S.sin.push({id:uid(),d:d.id,sq,q,c,sup:v('kis'),b:v('kib'),ex:v('kie'),date:today(),by:U.name});if(c)d.sc=c;logEv('Stock received: '+sq+' '+d.unit+' of '+d.name);R();alert('Received '+sq+' '+d.unit+(per(d)>1?' = '+q+' tablets/capsules. Cost of one tablet/capsule: UGX '+(c/per(d)).toFixed(2):'. Cost of one unit: UGX '+money(c)))}
function addOut(){const q=+v('koq'),d=v('kod');if(!d||!(q>0))return alert('Choose a drug and enter the quantity.');if(q>bal(d))return alert('Only '+bal(d)+' in stock for '+dn(d)+'.');S.sout.push({id:uid(),d,q,r:v('kor'),n:v('kon'),date:today(),by:U.name});logEv('Stock issued: '+q+' of '+dn(d)+' ('+v('kor')+')');if(bal(d)<=((S.drugs.find(x=>x.id==d)||{}).re||0))logEv('LOW STOCK: '+dn(d)+', balance '+bal(d));R()}
const prStock=()=>pr(head('Drug Stock Report ('+today()+')')+'<h4>Balances</h4>'+stkTbl()+'<h4>Recent movements</h4>'+movTbl());
const mlStock=()=>ml('','Drug stock report '+today()+' - '+S.clinic.name,`${S.clinic.name}\nDRUG STOCK REPORT ${today()}\n\n`+S.drugs.map(d=>`${d.name} (${d.unit}): in ${fmt(d,tin(d.id))}, out ${fmt(d,tout(d.id))}, balance ${fmt(d,bal(d.id))}${bal(d.id)<=d.re?' - LOW':''}, cost/unit ${money(cs(d))}${per(d)>1?', cost/tablet '+cpt1(d).toFixed(2):''}`).join('\n'));
/* messages */
const unread=()=>{if(!U)return 0;let ls=0;try{ls=+(localStorage.getItem('seen_'+U.id)||0)}catch(e){}return S.msg.filter(m=>m.ts>ls&&m.from!=U.id&&(m.to=='all'||m.to==U.id)).length};
V.msg=()=>{try{localStorage.setItem('seen_'+U.id,Date.now())}catch(e){}
const mine=S.msg.filter(m=>m.to=='all'||m.to==U.id||m.from==U.id).slice().reverse().slice(0,100);
return `<div class="card"><h3>Send message</h3><div class="f"><select id="mto"><option value="all">Everyone</option>${S.staff.filter(x=>x.id!=U.id).map(x=>`<option value="${x.id}">${esc(x.name)} (${x.role})</option>`).join('')}</select><select id="mpt"><option value="">No patient</option>${pOpts()}</select><label style="display:inline-flex;gap:4px;align-items:center;margin:0"><input type="checkbox" id="mur" style="width:auto"> Urgent</label></div><textarea id="mtx" rows="3" style="width:100%;margin:8px 0" placeholder="Type your message, e.g. Patient P0004 is ready for the doctor, lab results ready for P0002..."></textarea><button onclick="sendMsg()">Send</button></div>
<div class="card"><h3>Messages</h3>${mine.length?mine.map(m=>`<div style="border-bottom:1px solid var(--bd);padding:8px 0"><b>${esc(sn(m.from).name||'Unknown')}</b> to ${m.to=='all'?'Everyone':esc(sn(m.to).name||'Removed staff')} <span class="mu">${new Date(m.ts).toLocaleString()}</span>${m.urg?' <b style="color:#dc2626">URGENT</b>':''}${m.pid?` <span class="mu">· Patient ${m.pid} ${esc(pn(m.pid).name)}</span>`:''}<div>${nl(m.text)}</div></div>`).join(''):'<p class="mu">No messages yet.</p>'}</div>`};
function sendMsg(){if(!v('mtx'))return alert('Type a message first.');S.msg.push({id:uid(),from:U.id,to:v('mto'),pid:v('mpt'),urg:$('#mur').checked,text:v('mtx'),ts:nts()});R()}

/* notifications, blank lab form, backup */
const logEv=t=>{S.log.push({id:uid(),by:U?U.id:'',who:U?U.name:'',text:t,ts:nts()});if(S.log.length>300)S.log.splice(0,S.log.length-300)};
function toast(t){const d=document.createElement('div');d.style.cssText='background:#0f766e;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:6px;box-shadow:0 2px 8px #0005;max-width:320px;font-size:14px';d.textContent='🔔 '+t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),9000)}
const unreadN=()=>{if(!U)return 0;let ls=0;try{ls=+(localStorage.getItem('seenN_'+U.id)||0)}catch(e){}return S.log.filter(x=>x.ts>ls&&x.by!=U.id).length};
V.notif=()=>{try{localStorage.setItem('seenN_'+U.id,Date.now())}catch(e){}
return `<div class="card sc"><h3>Notifications: what is happening in the clinic</h3>${S.log.length?`<table><tr><th>Time</th><th>By</th><th>Activity</th></tr>${S.log.slice().reverse().slice(0,150).map(x=>`<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${esc(x.who)}</td><td>${esc(x.text)}</td></tr>`).join('')}</table>`:'<p class="mu">Nothing yet. New registrations, lab requests and results, Form 5s, sales, expenses and stock movements will appear here for every staff member.</p>'}</div>`};
const prBlankLab=()=>{const pid=v('lq'),p=pn(pid),nm=v('ln')||p.name||'',ts=[...document.querySelectorAll('.tk:checked')].map(c=>c.value);
pr(head('Laboratory Request Form')+`<table><tr><th>Patient name</th><td style="height:30px">${esc(nm)}</td><th>Patient No.</th><td>${esc(pid)}</td></tr><tr><th>Age / Sex</th><td style="height:30px">${p.id?esc(p.age)+' / '+p.sex:''}</td><th>Date</th><td>${today()}</td></tr><tr><th>Requested by</th><td style="height:30px">${esc(U?U.name:'')}</td><th>Clinical notes</th><td></td></tr></table>`+Object.entries(TG).map(([g,a])=>`<h4>${g}</h4><p style="column-count:2;margin:0">${a.map(t=>`${ts.includes(t)?'&#9745;':'&#9744;'} ${esc(t)}<br>`).join('')}</p>`).join('')+`<p>Results / remarks:</p><div style="border:1px solid #999;height:90px"></div><p>Requested by (signature): ____________ &nbsp; Lab technician: ____________</p>`)};
async function backupNow(){try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'clinic-backup-'+today()+'.json',data:new Blob([JSON.stringify({app:'clinic',date:today(),data:S})],{type:'application/json'})})}catch(e){alert('Could not save the backup here. Open the app in its own browser tab and try again.')}}
function restoreFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result).data;if(!o||!Array.isArray(o.staff)||!o.clinic)throw 0;ask('Replace ALL current records with this backup ('+f.name+')?',()=>{COLS.forEach(c=>{S[c]=Array.isArray(o[c])?o[c]:[]});S.clinic=o.clinic;S.rota=o.rota||{};U=S.staff.find(x=>x.id==U.id)||null;R();alert('Backup restored.')})}catch(e){alert('That file is not a valid clinic backup.')}};r.readAsText(f)}
(async()=>{try{DB=await claude.use('db')}catch(e){DB=null}
if(!DB){STAT='Local only (not shared)';if(!S.staff.length)seedStaff();R();return}
const onErr=e=>{STAT='Shared database unavailable ('+((e&&e.code)||'error')+'). Working locally.';SYNC=false;DB=null;if(!S.staff.length)seedStaff();R()};
COLS.forEach(c=>DB.collection(c).onSnapshot(q=>onCol(c,q),onErr));
['clinic','rota'].forEach(k=>DB.doc('meta/'+k).onSnapshot(q=>onMeta(k,q),onErr))})();
R();
</script></body></html>
