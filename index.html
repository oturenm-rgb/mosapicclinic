<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSAPIC GENERAL MEDICAL CLINIC - NAMET - MBALE</title>
<style>
body{font-family:Arial;background:#f0f8ff;padding:20px}
.card{background:white;padding:20px;border-radius:10px;max-width:600px;margin:auto;box-shadow:0 0 10px #ccc}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:1px solid #ccc}
button{background:#0d6efd;color:white;font-weight:bold;cursor:pointer}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#0d6efd;color:white}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;color:#0d6efd">MOSAPIC GENERAL MEDICAL CLINIC<br>NAMET - MBALE</h2>
<h4 style="text-align:center">SHARED SYSTEM - All Computers Same Data</h4>
<input id="name" placeholder="Patient Full Name">
<input id="age" type="number" placeholder="Age">
<select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select>
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Address / Village">
<button onclick="savePatient()">SAVE PATIENT - Shared to All Computers</button>
<p id="status" style="text-align:center;color:green"></p>
<table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Phone</th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
async function loadPatients(){
 const res = await fetch('/api/patients');
 const data = await res.json();
 const tbody = document.getElementById('list');
 tbody.innerHTML = '';
 data.forEach(p=>{
  tbody.innerHTML += `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.age}</td><td>${p.phone}</td></tr>`;
 });
}
async function savePatient(){
 const body = {
  name: document.getElementById('name').value,
  age: document.getElementById('age').value,
  gender: document.getElementById('gender').value,
  phone: document.getElementById('phone').value,
  address: document.getElementById('address').value
 };
 if(!body.name){alert('Enter name');return}
 document.getElementById('status').innerText='Saving...';
 await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 document.getElementById('status').innerText='Saved! Visible on ALL computers!';
 document.getElementById('name').value='';document.getElementById('phone').value='';
 loadPatients();
}
loadPatients();
</script>
</body>
</html>
